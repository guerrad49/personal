# ==============================================================================
# ⚠️ CRITICAL ENVIRONMENT NOTES & TROUBLESHOOTING:
# 
# 1. GLYPHS / SPECIAL CHARACTERS:
#    This theme relies on Powerline/Nerd Font symbols (, , ). If these look
#    like broken boxes, you MUST download a Nerd Font (e.g., FiraCode Nerd Font)
#    and select it as your active font inside your terminal app settings.
# 
# 2. PANE SWITCHING (OPTION + ARROWS):
#    By default, macOS intercepts the Option key. If pane switching fails:
#    - Native macOS Terminal: Settings -> Profiles -> Keyboard -> Check
#      "Use Option as Meta key".
#    - iTerm2: Settings -> Profiles -> Keys -> Set Left/Right Option to "Esc+".
#    - Also delete any terminal profile shortcuts mapping Option+Left/Right to
#      "Move cursor by word" to prevent terminal interception.
# 
# 3. PANE SYNCHRONIZATION:
#    Pressing 'Ctrl + x' locks all panes together. ALL borders flash RED as a
#    destructive safety warning. Press 'Ctrl + x' again to safely unlock.
# ==============================================================================


# ===============================================
# GENERAL SETTINGS
# ===============================================

# Enable mouse mode (scrolling, resizing, selecting)
set -g mouse on

# Sync tmux copy buffer with macOS clipboard
set -g copy-command "pbcopy"

# Disable (and free) default clunky keys
unbind r
unbind '"'
unbind %


# ===============================================
# KEY BINDINGS & SHORTCUTS
# ===============================================

# Reload config file
bind r source-file ~/.tmux.conf \; display 'Config reloaded!'

# Split panes using \ and -
bind \ split-window -h
bind - split-window -v

# Switch panes using Option + Arrow keys (w/o prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Toggle pane synchronization using Ctrl + x (w/o prefix)
bind -n C-x if-shell -F '#{synchronize-panes}' \
    "setw synchronize-panes off ; \
    set -g pane-border-style fg=white ; \
    set -g pane-active-border-style fg=colour23" \
    "setw synchronize-panes on  ; \
    set -g pane-border-style fg=colour1 ; \
    set -g pane-active-border-style fg=colour1"


# ===============================================
# THEME & STATUS BAR
# ===============================================

# General status bar layout
set-option -g status-justify left
set-option -g status-style bg=default
set-option -g status-interval 30

# -------------------------------------
# LEFT STATUS BAR
# -------------------------------------
set-option -g status-left ""
set-option -g status-left-length 16

# Session block
set-option -ag status-left "#[bg=colour8,fg=white] #S "
set-option -ag status-left "#[bg=black,fg=colour8] "

# -------------------------------------
# MIDDLE PORTION (WINDOW LIST & GIT)
# -------------------------------------
# Spacing between window tabs
set-option -g window-status-separator " "

# Inactive windows format
set-window-option -g window-status-format ""
set-window-option -ag window-status-format "#[fg=colour244]#W #[fg=colour8]"

# Active window base format
set-window-option -g window-status-current-format ""
set-window-option -ag window-status-current-format "#[bg=black]"
set-window-option -ag window-status-current-format "#[fg=colour220]#W "

# Append the Dynamic Git Branch to the end of the active window layout
set-window-option -ag window-status-current-format "#[fg=colour220]"
set-window-option -ag window-status-current-format "#(git -C "
set-window-option -ag window-status-current-format "#{pane_current_path} "
set-window-option -ag window-status-current-format "rev-parse --abbrev-ref HEAD 2>/dev/null "
set-window-option -ag window-status-current-format "| awk '{print \" \" $0 \" \"}')"

# Explicitly close the active container with the arrow transitioning
set-window-option -ag window-status-current-format "#[fg=black,bg=default]"

# -------------------------------------
# RIGHT STATUS BAR (Ayu Mirage Layout)
# -------------------------------------
set-option -g status-right ""
set-option -g status-right-length 55

# Hostname block: Transition from default bar to clean Blue container
set-option -ag status-right "#[bg=default,fg=black]"
set-option -ag status-right "#[bg=black,fg=white] #h "
# Time block: Transition from Blue down to Mid-Tone Grey container
set-option -ag status-right "#[fg=colour8]"
set-option -ag status-right "#[bg=colour8,fg=white] %H:%M:%S "
# Date block: Transition from Mid-Tone Grey down to Deep Space Black
set-option -ag status-right "#[fg=blue]"
set-option -ag status-right "#[bg=blue,fg=white] %a %e %b %Y "

# -------------------------------------
# PANES & BORDERS (Default Styles)
# -------------------------------------
set-option -g pane-border-style fg=white
set-option -g pane-active-border-style fg=colour23
