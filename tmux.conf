# reload config file
# unbind r
bind r source-file ~/.tmux.conf \; display 'Config reloaded!'

# split panes using \ and -
unbind '"'
bind + split-window -h
unbind %
bind - split-window -v

# switch panes using command-arrow w/o prefix
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# Synchronize all panes.
bind -n C-x setw synchronize-panes

# set mouse mode on
set -g mouse on

# statusbar
set-option -g status-justify left
set-option -g status-left '#[bg=colour72] #[bg=colour237] #[bg=colour236] #[bg=colour235]#[fg=colour159] #S | #[bg=colour236] '
set-option -g status-left-length 16
set-option -g status-bg colour237
set-option -g status-right '#[bg=colour236] #[bg=colour235]#[fg=colour185] #[fg=colour159] #H | #[fg=colour112] %H:%M:%S #[fg=colour159] | %a %e %b %Y #[bg=colour236]#[fg=colour3] #[bg=colour237] #[bg=colour72] #[]'
set-option -g status-right-length 55
set-option -g status-interval 60
# set -g status-left "#{?client_prefix, #Sᗎ *, #[bg=black, fg=colour159, bold]#S ᗎ}"
# set -g status-right "#[default, fg=colour59] #H #[bold, fg=colour112, bg=black] ᗎ %H:%M:%S #[bold, fg=white] ᗎ %a %e %b %Y"

set-option -g pane-active-border-style fg=colour23
set-option -g pane-border-style fg=colour23

